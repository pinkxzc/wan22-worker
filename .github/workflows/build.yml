# Сборка образа воркера прямо в GitHub Actions.
#
# Положить в репозиторий как .github/workflows/build.yml
#
# Перед первым запуском задать два секрета:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     DOCKERHUB_USERNAME  - логин на hub.docker.com
#     DOCKERHUB_TOKEN     - токен оттуда же (Account Settings -> Personal access tokens),
#                           НЕ пароль от аккаунта
#
# Дальше каждый push в main пересобирает образ и кладёт его в
# docker.io/<логин>/wan22-worker:latest
#
# Запустить вручную можно на вкладке Actions -> Build worker image -> Run workflow.

name: Build worker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - start.sh
      - wan22_i2v_api.json
      - workflow_config.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Образ около 10 ГБ, а на бесплатном раннере свободно всего ~14 ГБ.
      # Сносим предустановленное, что нам не нужно, - освобождает ~30 ГБ.
      # Без этого сборка падает на "no space left on device".
      - name: Освободить место на раннере
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wan22-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wan22-worker:${{ github.sha }}
          # Кэш слоёв между запусками: пересборка после правки handler.py
          # займёт минуту вместо двадцати, потому что слой с torch не тронут.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что дальше
        run: |
          echo "Образ: ${{ secrets.DOCKERHUB_USERNAME }}/wan22-worker:latest"
          echo "RunPod -> Serverless -> эндпоинт -> Edit -> Container Image"
          echo "После сохранения нажать Release workers, иначе останется старый."
